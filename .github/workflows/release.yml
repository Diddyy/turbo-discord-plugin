# Makes the GitHub release a Turbo server installs the plugin from: its sources at the tag (GitHub's
# source archive), which the server compiles. There is no built asset.
#
# Push a tag v1.2.3 that matches the manifest's Version: the plugin is checked and tested against
# turbo-cloud's main and the tag's release is made. A server linked to this repository (admin
# panel, Plugins, Link from GitHub) finds the release and installs the tag's sources.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (v1.2.3); made on the commit this run is started from if it does not exist
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  TurboCloudPath: ${{ github.workspace }}/turbo-cloud
  TurboCloudConfiguration: Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A manual run may name a tag nobody pushed yet: make it on the commit the run was started from. A tag made with
      # this run's token starts no second run.
      - name: Make the tag of a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" > /dev/null 2>&1 \
            || gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null

      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: plugin

      # What is installed is the tag's manifest as it is: its Version is the release's.
      - name: The tag is the manifest's version
        run: |
          version=$(jq -r .Version plugin/manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "manifest.json says Version $version: tag v$version, or change the manifest first." >&2
            exit 1
          fi

      - name: Check out turbo-cloud
        uses: actions/checkout@v4
        with:
          repository: nitrodevco/turbo-cloud
          path: turbo-cloud

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: plugin/global.json

      - name: Build turbo-cloud's server
        run: dotnet build turbo-cloud/Turbo.Main/Turbo.Main.csproj -c Release -nologo -v q

      - name: Test
        run: dotnet test plugin/tests/TurboDiscord.Tests -c Release -nologo

      - name: Check the package
        run: sh plugin/scripts/package.sh

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
